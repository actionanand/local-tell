name: Android Feature Validation

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/**'

permissions:
  contents: read

concurrency:
  group: localtell-android-feature-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load Android SDK configuration
        shell: bash
        run: |
          while IFS='=' read -r key value; do
            [[ -z "$key" || "$key" =~ ^# ]] && continue
            echo "$key=$value" >> "$GITHUB_ENV"
          done < android-sdk.properties

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android CLI
        shell: bash
        run: |
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
          test -n "${ANDROID_HOME:-}"
          printf '%s\n' "--sdk=${ANDROID_HOME}" > "$HOME/.androidrc"
          echo "$HOME/.android/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK platform and build tools
        shell: bash
        run: |
          android --version
          android sdk install \
            "platforms/android-${COMPILE_SDK_VERSION}" \
            "build-tools/${BUILD_TOOLS_VERSION}" \
            "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Validate configuration, lint and unit tests
        run: |
          python3 -m json.tool app-config.json >/dev/null
          python3 -m json.tool android-version.json >/dev/null
          gradle lint testDebugUnitTest

      - name: Build installable debug APK
        run: gradle assembleDebug

      # Release outputs stay under app/build; no production signing or publishing.
      - name: Validate release compilation and R8
        run: gradle assembleRelease bundleRelease

      - name: Prepare versioned debug APK
        id: debug_apk
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(python3 -c 'import json; print(json.load(open("android-version.json", encoding="utf-8"))["versionName"])')"
          [[ "$version_name" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]
          formatted_version="${version_name//./-}"
          apk_name="local-tell-${formatted_version}-debug.apk"
          source_apk="app/build/outputs/apk/debug/app-debug.apk"
          artifact_dir="app/build/outputs/feature-debug-artifact"
          test -s "$source_apk"
          mkdir -p "$artifact_dir"
          cp "$source_apk" "$artifact_dir/$apk_name"
          test -s "$artifact_dir/$apk_name"
          echo "name=$apk_name" >> "$GITHUB_OUTPUT"
          echo "version=$formatted_version" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: local-tell-${{ steps.debug_apk.outputs.version }}-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/outputs/feature-debug-artifact/${{ steps.debug_apk.outputs.name }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit-test reports on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: localtell-unit-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/test-results/testDebugUnitTest/**/*.xml
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Android lint reports on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: localtell-lint-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/lint-results*.html
            app/build/reports/lint-results*.xml
            app/build/reports/lint-results*.sarif
            app/build/reports/lint-results*.txt
            app/build/reports/lint-results*-files/**
            app/build/reports/lint-results*_files/**
            app/build/intermediates/lint_intermediate_text_report/**/*.txt
          if-no-files-found: warn
          retention-days: 14
